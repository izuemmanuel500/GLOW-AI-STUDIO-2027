<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — GLOW AI STUDIO 2027</title>

    <meta
        name="description"
        content="Login to GLOW AI STUDIO 2027."
    >

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            ✨ GLOW
        </div>

        <a href="/" class="nav-link">Home</a>
    </header>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-icon">✨</div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue creating with GLOW AI STUDIO 2027.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginUsername">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        placeholder="Username or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-btn auth-submit"
                    id="loginButton"
                >
                    Login
                </button>

                <p id="loginMessage" class="auth-message"></p>

            </form>

            <div class="auth-divider">
                <span>Don't have an account?</span>
            </div>

            <a href="/signup.html" class="secondary-btn">
                Create Account
            </a>

        </section>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            loginButton.disabled = true;
            loginButton.textContent = "Logging In...";

            loginMessage.textContent = "";
            loginMessage.className = "auth-message";

            const identifier = document
                .getElementById("loginUsername")
                .value
                .trim();

            const password = document
                .getElementById("loginPassword")
                .value;

            if (!identifier || !password) {
                loginMessage.textContent =
                    "Please enter your username/email and password.";

                loginMessage.classList.add("error");

                loginButton.disabled = false;
                loginButton.textContent = "Login";

                return;
            }

            try {

                const response = await fetch("/api/auth/login", {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    /*
                     * Send the identifier in all compatible fields.
                     * This supports both username and email login.
                     */
                    body: JSON.stringify({
                        identifier: identifier,
                        username: identifier,
                        email: identifier,
                        password: password
                    })
                });

                /*
                 * Read response as text first so an empty or
                 * non-JSON response does not cause:
                 *
                 * Unexpected end of JSON input
                 */
                const rawResponse = await response.text();

                let data = {};

                if (rawResponse.trim()) {

                    try {

                        data = JSON.parse(rawResponse);

                    } catch (jsonError) {

                        console.error(
                            "Invalid server response:",
                            rawResponse
                        );

                        throw new Error(
                            "The server returned an unexpected response. Please try again."
                        );
                    }
                }

                /*
                 * Login failed.
                 */
                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        data.message ||
                        "Invalid username/email or password."
                    );
                }

                /*
                 * Login successful.
                 */
                loginMessage.textContent =
                    data.message ||
                    "Login successful. Opening your dashboard...";

                loginMessage.classList.add("success");

                loginButton.textContent = "Login Successful ✓";

                /*
                 * Give Flask time to establish the session
                 * before opening the dashboard.
                 */
                setTimeout(function() {

                    window.location.href = "/dashboard.html";

                }, 700);

            } catch (error) {

                console.error("Login error:", error);

                loginMessage.textContent =
                    error.message ||
                    "Login failed. Please try again.";

                loginMessage.classList.add("error");

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }

        });
    </script>

</body>
</html>
